name: Benchmarks

on:
  pull_request:
    branches: [main]

# Note: This is an optional check - don't add to required status checks
# Benchmark updates are committed back to PR branches when possible

permissions:
  contents: write
  pull-requests: write

jobs:
  # Run benchmarks for tjs (once per draft for parallelism)
  benchmark-tjs:
    runs-on: ubuntu-latest
    # Skip if this is a bot commit (prevents infinite loop)
    if: github.actor != 'github-actions[bot]'
    strategy:
      matrix:
        draft: [draft4, draft6, draft7, draft2019-09, draft2020-12]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.head_ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run benchmark for tjs ${{ matrix.draft }}
        run: |
          mkdir -p benchmarks/results
          npx tsx benchmarks/bench.ts -v tjs ${{ matrix.draft }} \
            --json benchmarks/results/tjs-${{ matrix.draft }}.json

      - name: Upload tjs benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-tjs-${{ matrix.draft }}
          path: benchmarks/results/tjs-${{ matrix.draft }}.json

  # Run benchmarks for each validator (per draft for parallelism)
  benchmark-validator:
    runs-on: ubuntu-latest
    # Skip if this is a bot commit (prevents infinite loop)
    if: github.actor != 'github-actions[bot]'
    strategy:
      matrix:
        draft: [draft4, draft6, draft7, draft2019-09, draft2020-12]
        validator: [ajv, zod, joi, jsonschema, is-my-json-valid, z-schema, djv, jsen, schemasafe]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.head_ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run benchmark for ${{ matrix.validator }} ${{ matrix.draft }}
        run: |
          mkdir -p benchmarks/results
          npx tsx benchmarks/bench.ts -v ${{ matrix.validator }} ${{ matrix.draft }} \
            --json benchmarks/results/${{ matrix.validator }}-${{ matrix.draft }}.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.validator }}-${{ matrix.draft }}
          path: benchmarks/results/${{ matrix.validator }}-${{ matrix.draft }}.json

  # Merge results, update files, commit back to PR, and post comment
  finalize:
    runs-on: ubuntu-latest
    needs: [benchmark-tjs, benchmark-validator]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch main branch for comparison
        run: git fetch origin main:refs/remotes/origin/main

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          path: benchmarks/results
          pattern: benchmark-*
          merge-multiple: true

      - name: Merge benchmark results
        run: |
          # Merge tjs results from all drafts
          echo "Merging tjs results..."
          npx tsx benchmarks/merge-isolated.ts "benchmarks/results/tjs.json" \
            "benchmarks/results/tjs-draft4.json" \
            "benchmarks/results/tjs-draft6.json" \
            "benchmarks/results/tjs-draft7.json" \
            "benchmarks/results/tjs-draft2019-09.json" \
            "benchmarks/results/tjs-draft2020-12.json"

          # Merge each validator's results from all drafts
          for v in ajv zod joi jsonschema is-my-json-valid z-schema djv jsen schemasafe; do
            echo "Merging $v results..."
            npx tsx benchmarks/merge-isolated.ts "benchmarks/results/${v}.json" \
              "benchmarks/results/${v}-draft4.json" \
              "benchmarks/results/${v}-draft6.json" \
              "benchmarks/results/${v}-draft7.json" \
              "benchmarks/results/${v}-draft2019-09.json" \
              "benchmarks/results/${v}-draft2020-12.json"
          done

          # Clean up per-draft files
          rm -f benchmarks/results/*-draft*.json

      - name: Generate summary and reports
        run: |
          # Generate BENCHMARKS.md
          npx tsx benchmarks/generate-summary.ts

          # Update README.md
          npx tsx benchmarks/update-readme.ts

          # Update SVG chart
          npx tsx benchmarks/update-svg.ts

          # Generate detailed markdown reports for each validator
          for v in ajv zod joi jsonschema is-my-json-valid z-schema djv jsen schemasafe; do
            UPPER_NAME=$(echo "$v" | tr '[:lower:]-' '[:upper:]_')
            npx tsx benchmarks/generate-report.ts "$v" -o "benchmarks/results/BENCHMARK_${UPPER_NAME}.md"
          done

      # Only commit for PRs from the same repo (not forks)
      - name: Check for changes
        id: check_changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --staged --stat
          fi

      - name: Commit benchmark updates
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update benchmark results"
          git push origin HEAD:${{ github.head_ref }}

      - name: Generate PR comment
        run: npx tsx benchmarks/generate-comparison.ts --format pr-comment > benchmark-comment.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = fs.readFileSync('benchmark-comment.md', 'utf8');

            // Add note for fork PRs
            const isFork = context.payload.pull_request.head.repo.full_name !== context.payload.repository.full_name;
            if (isFork) {
              comment += '\n\n> Note: Benchmark files were not auto-committed because this PR is from a fork.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('## Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
