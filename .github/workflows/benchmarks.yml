name: Benchmarks

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  # Run isolated benchmark for tjs
  benchmark-tjs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        draft: [draft4, draft6, draft7, draft2019-09, draft2020-12]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run isolated benchmark for tjs ${{ matrix.draft }}
        run: |
          mkdir -p benchmarks/results
          npx tsx benchmarks/bench-isolated.ts tjs ${{ matrix.draft }} \
            --json benchmarks/results/tjs-${{ matrix.draft }}.json

      - name: Upload tjs benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-tjs-${{ matrix.draft }}
          path: benchmarks/results/tjs-${{ matrix.draft }}.json

  # Run isolated benchmark for ajv
  benchmark-ajv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        draft: [draft4, draft6, draft7, draft2019-09, draft2020-12]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run isolated benchmark for ajv ${{ matrix.draft }}
        run: |
          mkdir -p benchmarks/results
          npx tsx benchmarks/bench-isolated.ts ajv ${{ matrix.draft }} \
            --json benchmarks/results/ajv-${{ matrix.draft }}.json

      - name: Upload ajv benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ajv-${{ matrix.draft }}
          path: benchmarks/results/ajv-${{ matrix.draft }}.json

  comment:
    runs-on: ubuntu-latest
    needs: [benchmark-tjs, benchmark-ajv]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          path: benchmarks/results
          pattern: benchmark-*
          merge-multiple: true

      - name: Merge and compare benchmark results
        run: |
          # Merge tjs results
          npx tsx benchmarks/merge-isolated.ts benchmarks/results/tjs-isolated.json \
            benchmarks/results/tjs-draft4.json \
            benchmarks/results/tjs-draft6.json \
            benchmarks/results/tjs-draft7.json \
            benchmarks/results/tjs-draft2019-09.json \
            benchmarks/results/tjs-draft2020-12.json

          # Merge ajv results
          npx tsx benchmarks/merge-isolated.ts benchmarks/results/ajv-isolated.json \
            benchmarks/results/ajv-draft4.json \
            benchmarks/results/ajv-draft6.json \
            benchmarks/results/ajv-draft7.json \
            benchmarks/results/ajv-draft2019-09.json \
            benchmarks/results/ajv-draft2020-12.json

          # Compare tjs vs ajv (generates group-level results)
          npx tsx benchmarks/bench-compare.ts \
            benchmarks/results/tjs-isolated.json \
            benchmarks/results/ajv-isolated.json \
            --json benchmarks/results/ajv.json

      - name: Generate PR comment
        run: npx tsx benchmarks/generate-pr-comment.ts benchmarks/results/ajv.json > benchmark-comment.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('benchmark-comment.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('## Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
