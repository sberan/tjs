name: Regenerate Benchmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validators:
        description: 'Validators to benchmark (comma-separated: ajv,zod,joi or "all")'
        required: false
        default: 'all'

# Security note: This workflow only runs on push to main, not on PRs.
# Only maintainers with push access can trigger it, so write permissions are safe.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Run benchmarks for tjs (once per draft for parallelism)
  benchmark-tjs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        draft: [draft4, draft6, draft7, draft2019-09, draft2020-12]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run benchmark for tjs ${{ matrix.draft }}
        run: |
          mkdir -p benchmarks/results
          npx tsx benchmarks/bench.ts -v tjs ${{ matrix.draft }} \
            --json benchmarks/results/tjs-${{ matrix.draft }}.json

      - name: Upload tjs benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-tjs-${{ matrix.draft }}
          path: benchmarks/results/tjs-${{ matrix.draft }}.json

  # Run benchmarks for each validator (per draft for parallelism)
  benchmark-validator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        draft: [draft4, draft6, draft7, draft2019-09, draft2020-12]
        validator: [ajv, zod, joi, jsonschema, is-my-json-valid, z-schema, djv, jsen, schemasafe]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run benchmark for ${{ matrix.validator }} ${{ matrix.draft }}
        run: |
          mkdir -p benchmarks/results
          npx tsx benchmarks/bench.ts -v ${{ matrix.validator }} ${{ matrix.draft }} \
            --json benchmarks/results/${{ matrix.validator }}-${{ matrix.draft }}.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.validator }}-${{ matrix.draft }}
          path: benchmarks/results/${{ matrix.validator }}-${{ matrix.draft }}.json

  # Merge results and create PR
  finalize:
    runs-on: ubuntu-latest
    needs: [benchmark-tjs, benchmark-validator]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          path: benchmarks/results
          pattern: benchmark-*
          merge-multiple: true

      - name: Merge benchmark results
        run: |
          # Merge tjs results from all drafts
          echo "Merging tjs results..."
          npx tsx benchmarks/merge-isolated.ts "benchmarks/results/tjs.json" \
            "benchmarks/results/tjs-draft4.json" \
            "benchmarks/results/tjs-draft6.json" \
            "benchmarks/results/tjs-draft7.json" \
            "benchmarks/results/tjs-draft2019-09.json" \
            "benchmarks/results/tjs-draft2020-12.json"

          # Merge each validator's results from all drafts
          for v in ajv zod joi jsonschema is-my-json-valid z-schema djv jsen schemasafe; do
            echo "Merging $v results..."
            npx tsx benchmarks/merge-isolated.ts "benchmarks/results/${v}.json" \
              "benchmarks/results/${v}-draft4.json" \
              "benchmarks/results/${v}-draft6.json" \
              "benchmarks/results/${v}-draft7.json" \
              "benchmarks/results/${v}-draft2019-09.json" \
              "benchmarks/results/${v}-draft2020-12.json"
          done

          # Clean up per-draft files
          rm -f benchmarks/results/*-draft*.json

      - name: Generate summary and reports
        run: |
          # Generate BENCHMARKS.md
          npx tsx benchmarks/generate-summary.ts

          # Update README.md
          npx tsx benchmarks/update-readme.ts

          # Update SVG chart
          npx tsx benchmarks/update-svg.ts

          # Generate detailed markdown reports for each validator
          for v in ajv zod joi jsonschema is-my-json-valid z-schema djv jsen schemasafe; do
            UPPER_NAME=$(echo "$v" | tr '[:lower:]-' '[:upper:]_')
            npx tsx benchmarks/generate-report.ts "$v" -o "benchmarks/results/BENCHMARK_${UPPER_NAME}.md"
          done

      - name: Check for significant changes
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
            exit 0
          fi

          echo "Changes detected, checking significance..."
          git diff --staged --stat

          # Check if changes are significant (exits 0 if significant, 1 if noise)
          if npx tsx benchmarks/check-significance.ts; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Changes are within noise threshold, skipping PR"
          fi

      - name: Generate change summary
        if: steps.check_changes.outputs.has_changes == 'true'
        id: summary
        run: |
          # Generate summary of what changed using the comparison tool
          npx tsx benchmarks/generate-comparison.ts --format pr-body > pr-body.md
          echo "Generated PR body with comparison"

      - name: Create or update PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH_NAME="chore/update-benchmarks"

          # Configure git to use PAT for push
          # IMPORTANT: Use a real user identity (not github-actions[bot]) so the push triggers workflows
          # GitHub blocks workflow triggers from bot commits even when using a PAT
          git config user.name "sberan"
          git config user.email "sberan@gmail.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # Always start fresh from main (single commit approach)
          git checkout -B "$BRANCH_NAME" origin/main

          # Stage all changes
          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Single commit with all benchmark updates
          git commit -m "chore: update benchmark results"

          # Force push to update the branch (replaces any previous commits)
          # Using PAT allows this push to trigger the test workflow
          git push -f origin "$BRANCH_NAME"

          # Read the generated PR body
          PR_BODY=$(cat pr-body.md)
          PR_BODY="${PR_BODY}

          ---
          *Auto-generated from commit ${{ github.sha }}. Merge anytime to update benchmarks.*"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating PR #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" --body "$PR_BODY"
            echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "PR URL: https://github.com/${{ github.repository }}/pull/$EXISTING_PR"
          else
            echo "Creating new PR..."
            NEW_PR_URL=$(gh pr create \
              --title "chore: update benchmark results" \
              --body "$PR_BODY")
            # Extract PR number from URL
            NEW_PR_NUMBER=$(echo "$NEW_PR_URL" | grep -o '[0-9]*$')
            echo "pr_number=$NEW_PR_NUMBER" >> $GITHUB_OUTPUT
          fi

          # Save the commit SHA for triggering tests
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      # Trigger the test workflow on the benchmark branch
      # Note: push events from workflows don't trigger other workflows (GitHub anti-recursion)
      # so we use repository_dispatch with the PAT to explicitly trigger tests
      - name: Trigger test workflow
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Triggering test workflow for ref: chore/update-benchmarks (commit: $COMMIT_SHA)"

          # Use repository_dispatch to trigger the test workflow
          # This only requires repo scope, not workflow scope
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=test-benchmark-pr \
            -f client_payload[ref]=chore/update-benchmarks \
            -f client_payload[sha]=$COMMIT_SHA

          # Wait a moment for the workflow to be queued
          sleep 5

          # Get the run ID of the triggered workflow (look for repository_dispatch events)
          RUN_ID=$(gh run list --workflow=test.yml --event=repository_dispatch --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "Triggered run ID: $RUN_ID"

          # Create a pending status on the commit
          gh api repos/${{ github.repository }}/statuses/$COMMIT_SHA \
            -f state=pending \
            -f context="Test" \
            -f description="Tests are running..." \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"

      - name: No changes message
        if: steps.check_changes.outputs.has_changes != 'true'
        run: echo "No significant changes to benchmark data - PR not created/updated"
