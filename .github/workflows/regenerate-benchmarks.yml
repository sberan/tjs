name: Regenerate Benchmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validators:
        description: 'Validators to benchmark (comma-separated: ajv,zod,joi or "all")'
        required: false
        default: 'all'

# Security note: This workflow only runs on push to main, not on PRs.
# Only maintainers with push access can trigger it, so write permissions are safe.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Run benchmarks for each draft in parallel
  benchmark-draft:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        draft: [draft4, draft6, draft7, draft2019-09, draft2020-12]
        validator: [ajv, zod, joi]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run benchmark for ${{ matrix.validator }} ${{ matrix.draft }}
        run: |
          mkdir -p benchmarks/results
          npx tsx benchmarks/bench.ts ${{ matrix.draft }} -v ${{ matrix.validator }} \
            --json benchmarks/results/${{ matrix.validator }}-${{ matrix.draft }}.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.validator }}-${{ matrix.draft }}
          path: benchmarks/results/${{ matrix.validator }}-${{ matrix.draft }}.json

  # Merge results and create PR
  finalize:
    runs-on: ubuntu-latest
    needs: benchmark-draft

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          path: benchmarks/results
          pattern: benchmark-*
          merge-multiple: true

      - name: Merge benchmark results per validator
        run: |
          for v in ajv zod joi; do
            echo "Merging results for $v..."
            npx tsx benchmarks/merge-benchmarks.ts "benchmarks/results/${v}.json" \
              "benchmarks/results/${v}-draft4.json" \
              "benchmarks/results/${v}-draft6.json" \
              "benchmarks/results/${v}-draft7.json" \
              "benchmarks/results/${v}-draft2019-09.json" \
              "benchmarks/results/${v}-draft2020-12.json"

            # Generate markdown report
            npx tsx benchmarks/json-to-markdown.ts "benchmarks/results/${v}.json" > "benchmarks/results/BENCHMARK_${v^^}.md"
          done

          # Clean up per-draft files
          rm -f benchmarks/results/*-draft*.json

      - name: Run compliance tests
        run: npm test -- --reporter=verbose 2>&1 || true

      - name: Update SVG chart
        run: npx tsx benchmarks/update-svg.ts

      - name: Update README
        run: npx tsx benchmarks/update-readme.ts

      - name: Check for significant changes
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
            exit 0
          fi

          echo "Changes detected, checking significance..."
          git diff --staged --stat

          # Check if changes are significant (exits 0 if significant, 1 if noise)
          if npx tsx benchmarks/check-significance.ts; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Changes are within noise threshold, skipping PR"
          fi

      - name: Generate change summary
        if: steps.check_changes.outputs.has_changes == 'true'
        id: summary
        run: |
          # Generate summary of what changed using the comparison tool
          npx tsx benchmarks/generate-comparison.ts --format pr-body > pr-body.md
          echo "Generated PR body with comparison"

      - name: Create or update PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH_NAME="chore/update-benchmarks"

          # Configure git to use PAT for push (triggers workflows)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # Always start fresh from main (single commit approach)
          git checkout -B "$BRANCH_NAME" origin/main

          # Stage all changes
          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Single commit with all benchmark updates
          git commit -m "chore: update benchmark results"

          # Force push to update the branch (replaces any previous commits)
          # Using PAT allows this push to trigger the test workflow
          git push -f origin "$BRANCH_NAME"

          # Read the generated PR body
          PR_BODY=$(cat pr-body.md)
          PR_BODY="${PR_BODY}

          ---
          *Auto-generated from commit ${{ github.sha }}. Merge anytime to update benchmarks.*"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating PR #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" --body "$PR_BODY"
            echo "PR URL: https://github.com/${{ github.repository }}/pull/$EXISTING_PR"
          else
            echo "Creating new PR..."
            gh pr create \
              --title "chore: update benchmark results" \
              --body "$PR_BODY"
          fi

      - name: No changes message
        if: steps.check_changes.outputs.has_changes != 'true'
        run: echo "No significant changes to benchmark data - PR not created/updated"
