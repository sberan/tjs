name: Test Dispatch (Debug)

# Manual trigger only - for testing repository_dispatch triggering
on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  test-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push test commit and trigger dispatch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH_NAME="test/dispatch-debug"

          git config user.name "sberan"
          git config user.email "sberan@gmail.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # Create test branch
          git checkout -B "$BRANCH_NAME" origin/main
          echo "# Test $(date)" > TEST_DISPATCH.md
          git add TEST_DISPATCH.md
          git commit -m "test: dispatch debug"
          git push -f origin "$BRANCH_NAME"

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Pushed commit: $COMMIT_SHA"

          # Trigger test workflow via repository_dispatch
          echo "Triggering repository_dispatch..."
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=test-benchmark-pr \
            -f client_payload[ref]=$BRANCH_NAME \
            -f client_payload[sha]=$COMMIT_SHA

          sleep 5

          # Get the run ID
          RUN_ID=$(gh run list --workflow=test.yml --event=repository_dispatch --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "Triggered run ID: $RUN_ID"

          # Create pending status on the commit
          echo "Creating pending status..."
          gh api repos/${{ github.repository }}/statuses/$COMMIT_SHA \
            -f state=pending \
            -f context="Test" \
            -f description="Tests are running..." \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
